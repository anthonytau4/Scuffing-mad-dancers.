<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Scuffing Mad Dancers</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0a08">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .lost {
      min-height: 100svh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem 1.5rem;
    }
    .lost img {
      width: min(220px, 60vw);
      margin: 0 auto 1.6rem;
      filter: drop-shadow(0 18px 44px rgba(0, 0, 0, .45));
      animation: float 6s ease-in-out infinite;
    }
    .lost .code {
      font-family: var(--font-display);
      font-weight: 800;
      font-size: clamp(4rem, 14vw, 7rem);
      line-height: 1;
      background: var(--grad-brand);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lost p { color: var(--muted); max-width: 420px; margin: .8rem auto 1.8rem; }
  </style>
</head>
<body>
  <main class="lost">
    <div>
      <img src="/logo-mark.png" alt="Scuffing Mad Dancers logo" width="220" height="220">
      <div class="code">404</div>
      <h1 style="font-size: clamp(1.6rem, 5vw, 2.4rem);">Looks like you scuffed off the dance floor.</h1>
      <p>The page you are after does not exist &mdash; but the music is still going back on the home page.</p>
      <a class="btn btn-primary btn-lg" href="/">Back to the floor</a>
    </div>
  </main>
</body>
</html>
